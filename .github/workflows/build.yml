name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the ink engine and build the APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk SkiNotes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SkiNotes-apk
          path: SkiNotes.apk

      # Puts the APK on the repo's Releases page so it can be downloaded straight to a phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" SkiNotes.apk \
            --title "Ski Notes build ${{ github.run_number }}" \
            --notes "Download SkiNotes.apk on your Android phone and open it to install." \
            --latest
